<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유명템 | 영상 속 그 제품</title>
<meta name="description" content="연예인이 영상에서 직접 쓴 제품을 한곳에 모았어요.">
<meta name="theme-color" content="#15171C">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --page:#EEF0F3; --paper:#FFFFFF; --ink:#15171C; --mute:#6A707C; --hair:#DFE2E7;
  --mark:#FFE14D; --go:#2B47F5; --go-ink:#FFFFFF;
  --r:14px;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,system-ui,-apple-system,sans-serif;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit}
.shell{max-width:720px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}

/* 상단: 이름 + 검색 (스크롤해도 붙어 있음) */
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;margin:0 -14px;padding:12px 14px 12px}
.top-row{display:flex;align-items:center;gap:12px}
.brand{display:block;flex:none;width:100px;height:44px;margin:-2px 0 -2px -6px}
.search{position:relative;flex:1}
.search input{width:100%;height:42px;border:0;border-radius:10px;padding:0 40px 0 38px;font:inherit;font-size:15px;background:#2A2D35;color:#fff;outline:none}
.search input::placeholder{color:#9AA0AB}
.search input:focus{box-shadow:0 0 0 2px var(--mark)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#9AA0AB;fill:none;stroke-width:2}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#9AA0AB;font-size:18px;cursor:pointer;display:none}
.search.has .clear{display:block}

.disclose{font-size:12px;color:var(--mute);margin:10px 2px 0;line-height:1.45}

/* 연예인 고르기 */
.who{display:flex;gap:6px;overflow-x:auto;margin:14px -14px 0;padding:0 14px 2px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--hair);background:var(--paper);color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.who button span{font-weight:500;color:var(--mute);font-size:12px}
.who button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.who button[aria-pressed=true] span{color:#C9CDD4}

.status{font-size:13px;color:var(--mute);margin:14px 2px 10px}

/* 제품 목록: 휴대폰 2칸, 넓은 화면 3칸 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
.card{display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r);overflow:hidden;text-decoration:none;border:1px solid var(--hair)}
.card:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.shot{position:relative;aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--hair)}
.shot img{width:86%;height:86%;object-fit:contain}
.shot .kind{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:#F1F2F5;color:#4A505C}
.shot .new{position:absolute;right:8px;top:8px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--mark);color:var(--ink)}
.body{display:flex;flex-direction:column;gap:6px;padding:10px 11px 11px;flex:1}
.celeb{font-size:12px;font-weight:700;color:var(--mute)}
/* 영상 제목을 쇼츠 제목 상자처럼 형광펜으로 */
.video{font-size:14px;font-weight:700;line-height:1.38;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.name{font-size:12.5px;color:var(--mute);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-top:auto;padding-top:2px}
.btn{display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;background:var(--go);color:var(--go-ink);font-weight:700;font-size:14px}
@media(hover:hover){.card:hover .btn{background:#1F37D6}}

.empty{grid-column:1/-1;background:var(--paper);border:1px dashed var(--hair);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--mute)}
.empty button{margin-top:10px;height:38px;padding:0 16px;border-radius:10px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.foot{font-size:12px;color:var(--mute);margin:22px 2px 0;line-height:1.6}
@media(prefers-reduced-motion:no-preference){.grid.fresh .card{animation:in .28s ease-out both}@keyframes in{from{opacity:0}}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-row">
      <img class="brand" src="logo.svg" alt="유명템" width="100" height="44">
      <label class="search" id="sbox">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="연예인, 제품 이름으로 찾기" aria-label="연예인이나 제품 이름으로 찾기">
        <button type="button" class="clear" id="clear" aria-label="검색어 지우기">×</button>
      </label>
    </div>
  </header>
  <p class="disclose">이 페이지의 링크는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

  <nav class="who" id="who" aria-label="연예인별로 보기"></nav>
  <p class="status" id="status" aria-live="polite"></p>
  <main class="grid" id="grid"></main>

  <p class="foot">'같은 종류'는 영상 속 제품을 쿠팡에서 찾지 못해 모양과 쓰임이 같은 제품을 연결한 거예요. 가격은 확인한 날 기준이라 쿠팡에서 바뀔 수 있어요.</p>
</div>
<script>
{
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kst = s => s ? new Date(s.replace(" ", "T") + ":00+09:00").getTime() : 0;
let all = [], pick = "", q = "";
try { pick = sessionStorage.getItem("ymt-pick") || ""; } catch (e) {}

function drawWho() {
  const n = {}; all.forEach(x => n[x.celeb] = (n[x.celeb] || 0) + 1);
  const names = Object.keys(n);
  if (pick && !names.includes(pick)) pick = "";
  $("who").innerHTML = [["", all.length], ...names.map(c => [c, n[c]])].map(([c, k]) =>
    `<button type="button" data-c="${esc(c)}" aria-pressed="${c === pick}">${c ? esc(c) : "전체"}<span>${k}</span></button>`).join("");
}
function drawGrid() {
  const words = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = all.filter(x => (!pick || x.celeb === pick) &&
    words.every(w => (x.celeb + " " + x.video + " " + x.title).toLowerCase().includes(w)));
  const where = pick ? `${pick}의 제품` : "모든 제품";
  $("status").textContent = q ? `'${q.trim()}' 찾은 결과 ${rows.length}개` : `${where} ${rows.length}개 · 최근 영상부터`;
  const g = $("grid"); g.classList.remove("fresh"); void g.offsetWidth; g.classList.add("fresh");
  g.innerHTML = rows.length ? rows.map(x => `
    <a class="card" href="${esc(x.url)}" target="_blank" rel="noopener sponsored" aria-label="${esc(x.celeb)} ${esc(x.video)}, ${esc(x.title)}, ${esc(x.price)}, 쿠팡에서 보기">
      <div class="shot">${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        ${x.same ? "" : `<span class="kind">같은 종류</span>`}${x.isNew ? `<span class="new">NEW</span>` : ""}</div>
      <div class="body">
        <div class="celeb">${esc(x.celeb)}</div>
        <div class="video"><mark>${esc(x.video)}</mark></div>
        <div class="name">${esc(x.title)}</div>
        ${x.price ? `<div class="price">${esc(x.price)}</div>` : ""}
        <span class="btn">쿠팡에서 보기</span>
      </div>
    </a>`).join("")
    : `<div class="empty">찾는 제품이 없어요.<br>연예인 이름이나 제품 종류(예: 크림, 샴푸)로 다시 찾아보세요.<br><button type="button" id="reset">전체 보기</button></div>`;
  const r = $("reset"); if (r) r.onclick = () => { q = ""; pick = ""; $("q").value = ""; $("sbox").classList.remove("has"); drawWho(); drawGrid(); };
}
$("who").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  pick = b.dataset.c; try { sessionStorage.setItem("ymt-pick", pick); } catch (e) {}
  drawWho(); drawGrid();
});
$("q").addEventListener("input", e => { q = e.target.value; $("sbox").classList.toggle("has", !!q); drawGrid(); });
$("clear").addEventListener("click", () => { q = ""; $("q").value = ""; $("sbox").classList.remove("has"); $("q").focus(); drawGrid(); });

fetch("items.json?v=" + Date.now()).then(r => r.json()).then(items => {
  const now = Date.now();
  all = items.map((x, i) => ({...x, t: kst(x.at), i}))
    .filter(x => x.t <= now)
    .map(x => ({...x, isNew: x.t && now - x.t < 3 * 864e5}))
    .sort((a, b) => (b.t - a.t) || (a.i - b.i));
  drawWho(); drawGrid();
}).catch(() => {
  $("grid").innerHTML = `<div class="empty">목록을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`;
});
}
</script>
</body>
</html>
